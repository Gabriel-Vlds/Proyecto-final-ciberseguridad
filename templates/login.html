<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso | Banco Horizonte Demo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main class="login-card">
    <p class="eyebrow">ENTORNO DE PRACTICA · DATOS FICTICIOS</p>
    <h1>Banco Horizonte</h1>
    <p class="muted">Accede a tu banca de demostracion.</p>
    {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Contrasena</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Iniciar sesion</button>
    </form>
    <p class="hint">Usa las credenciales configuradas para este laboratorio local.</p>
  </main>
</body>
</html>
